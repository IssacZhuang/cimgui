name: Build Alco cimgui

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.91.6-alco.1)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            cmake_arch: x64
          - target: win-arm64
            cmake_arch: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: CMake Configure
        run: |
          mkdir build
          cd build
          cmake -A ${{ matrix.cmake_arch }} ..

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimgui-${{ matrix.target }}
          path: build/Release/cimgui.dll

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            toolchain: native
          - target: linux-arm64
            toolchain: linux-arm64
          - target: android-arm64
            toolchain: android
            android_abi: arm64-v8a
          - target: android-x64
            toolchain: android
            android_abi: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM64 Cross-Compiler
        if: matrix.toolchain == 'linux-arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Android NDK
        if: matrix.toolchain == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Generate Linux ARM64 Toolchain File
        if: matrix.toolchain == 'linux-arm64'
        run: |
          cat > toolchain-linux-arm64.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          EOF

      - name: CMake Configure
        shell: bash
        run: |
          mkdir build
          cd build
          ARGS=()
          ARGS+=(-DCMAKE_BUILD_TYPE=Release)
          ARGS+=(-DCMAKE_CXX_FLAGS="-fno-exceptions -fno-rtti")
          if [ "${{ matrix.toolchain }}" = "linux-arm64" ]; then
            ARGS+=(-DCMAKE_TOOLCHAIN_FILE=../toolchain-linux-arm64.cmake)
          elif [ "${{ matrix.toolchain }}" = "android" ]; then
            ARGS+=(-DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake)
            ARGS+=(-DANDROID_ABI=${{ matrix.android_abi }})
            ARGS+=(-DANDROID_PLATFORM=android-21)
          fi
          cmake "${ARGS[@]}" ..

      - name: Build
        run: cmake --build build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimgui-${{ matrix.target }}
          path: build/cimgui.so

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: osx-arm64
            cmake_osx_arch: arm64
          - target: osx-x64
            cmake_osx_arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: CMake Configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-fno-exceptions -fno-rtti" -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }} ..

      - name: Build
        run: cmake --build build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimgui-${{ matrix.target }}
          path: build/cimgui.dylib

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cimgui-*

      - name: Organize and Package
        run: |
          mkdir -p runtimes/win-x64/native
          mkdir -p runtimes/win-arm64/native
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/linux-arm64/native
          mkdir -p runtimes/osx-arm64/native
          mkdir -p runtimes/osx-x64/native
          mkdir -p runtimes/android-arm64/native
          mkdir -p runtimes/android-x64/native

          cp artifacts/cimgui-win-x64/cimgui.dll runtimes/win-x64/native/
          cp artifacts/cimgui-win-arm64/cimgui.dll runtimes/win-arm64/native/
          cp artifacts/cimgui-linux-x64/cimgui.so runtimes/linux-x64/native/
          cp artifacts/cimgui-linux-arm64/cimgui.so runtimes/linux-arm64/native/
          cp artifacts/cimgui-osx-arm64/cimgui.dylib runtimes/osx-arm64/native/
          cp artifacts/cimgui-osx-x64/cimgui.dylib runtimes/osx-x64/native/
          cp artifacts/cimgui-android-arm64/cimgui.so runtimes/android-arm64/native/
          cp artifacts/cimgui-android-x64/cimgui.so runtimes/android-x64/native/

          zip -r cimgui-${{ inputs.release_tag }}-runtimes.zip runtimes/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: cimgui-${{ inputs.release_tag }}-runtimes.zip
